info:
  name: get humidity history copy
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:3000/humidity/stats?range=24h&deviceCode=ESP32-RIEGO-01
  params:
    - name: range
      value: 24h
      type: query
    - name: deviceCode
      value: ESP32-RIEGO-01
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
