info:
  name: get humidity history copy
  type: http
  seq: 4

http:
  method: GET
  url: "{{API_URL}}/humidity/stats?range=24h&deviceCode=esp32-01"
  params:
    - name: range
      value: 24h
      type: query
    - name: deviceCode
      value: esp32-01
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
