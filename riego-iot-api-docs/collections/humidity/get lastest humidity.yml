info:
  name: get lastest humidity
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:3000/humidity/latest?deviceCode=ESP32-RIEGO-01
  params:
    - name: deviceCode
      value: ESP32-RIEGO-01
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
