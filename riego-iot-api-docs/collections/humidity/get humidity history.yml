info:
  name: get humidity history
  type: http
  seq: 3

http:
  method: GET
  url: http://api.riego.pipexapp.com/humidity/history?range=24h&deviceCode=esp32-01
  params:
    - name: range
      value: 24h
      type: query
    - name: deviceCode
      value: esp32-01
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
